name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

# If you push twice quickly, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  web:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-planner-web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: recipe-planner-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Docker images
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t recipe-planner-api ./RecipePlanner.Api

      - name: Build web image
        run: docker build -t recipe-planner-web ./recipe-planner-web