name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only needs to read the code
permissions:
  contents: read

# If you push twice quickly, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded pull request runs. Never cancel a run on main, which could stop a deploy halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'  # pinned: 10.0.403 is listed by Microsoft but not downloadable yet; go back to 10.0.x later

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  web:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipe-planner-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: recipe-planner-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Test
        run: npx ng test --watch=false

  # On pull requests, prove both images still build. On main, the deploy job builds them for real.
  docker:
    name: Docker images
    needs: [api, web]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t recipe-planner-api ./RecipePlanner.Api

      - name: Build web image
        run: docker build -t recipe-planner-web ./recipe-planner-web

  # Every push to main that passes the tests is deployed. Signs in to Azure with a short-lived token
  # (OpenID Connect), so no Azure password or key is stored in GitHub.
  deploy:
    name: Deploy to Azure
    needs: [api, web]
    # Skipped until the Azure sign-in is set up (the AZURE_CLIENT_ID repository variable exists)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets this job request the sign-in token; nothing else gets it
    concurrency:
      group: deploy-production
      cancel-in-progress: false # two quick merges deploy one after the other, never at the same time
    env:
      RG: recipe-planner-rg
      ACR: recipeplanner516
      # Tag images with the commit, so every deploy is traceable to exact code and easy to roll back
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to the container registry
        run: az acr login --name "$ACR"

      - name: Build and push the API image
        run: docker buildx build --platform linux/amd64 -t "$ACR.azurecr.io/recipe-api:$TAG" --push ./RecipePlanner.Api

      - name: Build and push the web image
        run: docker buildx build --platform linux/amd64 -t "$ACR.azurecr.io/recipe-web:$TAG" --push ./recipe-planner-web

      # API first: it runs any database migrations, and the new web app may call new API endpoints
      - name: Deploy the API
        run: az containerapp update --name recipe-api --resource-group "$RG" --image "$ACR.azurecr.io/recipe-api:$TAG" --output none

      - name: Deploy the web app
        run: az containerapp update --name recipe-web --resource-group "$RG" --image "$ACR.azurecr.io/recipe-web:$TAG" --output none

      # Fail loudly (and email you) if the live site doesn't answer. Both apps may be starting from zero.
      - name: Check the live site
        run: |
          url="https://$(az containerapp show --name recipe-web --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/library" || true)
            if [ "$code" = "200" ]; then echo "Live site is up: $url"; exit 0; fi
            echo "Attempt $i: got $code, waiting..."; sleep 15
          done
          echo "The live site didn't respond with 200 after 5 minutes"; exit 1
