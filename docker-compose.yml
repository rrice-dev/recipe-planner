services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recipe_planner
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe -d recipe_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./RecipePlanner.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=recipe_planner;Username=recipe;Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      # Local photo storage. This is Azurite's built-in development key, published by Microsoft
      # for the emulator; it is not a real secret and doesn't work against real Azure.
      PhotoStorage__ConnectionString: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  # Local stand-in for Azure Blob Storage, so recipe photos work without an Azure account
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    volumes:
      - azuritedata:/data

  web:
    build: ./recipe-planner-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  azuritedata: