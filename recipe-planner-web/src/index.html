<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recipe Planner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply your saved theme before anything draws, so a dark-mode page never flashes white
    try { var t = localStorage.getItem('rp-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
