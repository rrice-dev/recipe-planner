<header class="topbar">
  <a routerLink="/recipes" class="brand" (click)="menuOpen.set(false)">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 21c-.2-6 1.8-11.2 7.5-15.5C20 12 17 18.5 12 21Z" fill="var(--accent)" />
      <path d="M12 21C11 15.5 8.5 11.6 4 9.5 4 15.2 7 19.5 12 21Z" fill="var(--saffron)" />
    </svg>
    Recipe Planner
  </a>
  <button type="button" class="menu-toggle" (click)="menuOpen.set(!menuOpen())"
          [attr.aria-expanded]="menuOpen()" aria-controls="main-nav">{{ menuOpen() ? 'Close' : 'Menu' }}</button>
  <nav id="main-nav" class="main-nav" [class.open]="menuOpen()" (click)="closeOnLink($event)">
    @if (auth.isLoggedIn()) {
      <a routerLink="/recipes" routerLinkActive="active">Recipes</a>
      <a routerLink="/meal-plans" routerLinkActive="active">Meal plans</a>
      <a routerLink="/fridge" routerLinkActive="active">What can I make?</a>
      <a routerLink="/shopping-list" routerLinkActive="active">Shopping list</a>
    }
    <a routerLink="/library" routerLinkActive="active">Browse</a>
    <a routerLink="/techniques" routerLinkActive="active">Techniques</a>
    <div class="nav-end">
      @if (auth.isLoggedIn()) {
        <a routerLink="/settings" routerLinkActive="active">Settings</a>
        <button type="button" class="link" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Log in</a>
      }
    </div>
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>
