# Security headers for every response from the web container. Included in each location block, because a
# location that adds any header of its own (like Cache-Control) drops the ones set at the server level.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Browsers that have visited over HTTPS refuse plain HTTP for a year. Ignored over plain HTTP (docker compose).
add_header Strict-Transport-Security "max-age=31536000" always;

# Report-only for now: browsers log what this policy WOULD block to the console, but block nothing. Once a few
# days of normal use show no reports, rename the header to Content-Security-Policy to enforce it.
# The two script hashes are the inline scripts in the built index.html (the theme script from src/index.html,
# and the one Angular adds for stylesheet loading). If either changes, its new hash shows up in the reports.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-XC4nS3DOE16LBy70xigDgY6YLo1FHQ2T+MgygD+oUDE=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
